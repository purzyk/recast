name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GCP_PROJECT: recast-purzycki
  GCP_REGION: europe-west1
  SERVICE: recast

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for Workload Identity Federation: lets the job mint an OIDC
      # token that Google exchanges for short-lived credentials. No service
      # account key is stored anywhere.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed by the migration step below, which runs the Prisma CLI on the
      # runner rather than inside the image.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/444818248992/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@recast-purzycki.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Migrations run here rather than at container startup: Cloud Run can
      # start several instances at once, which would race each other applying
      # the same migration. Running once in the pipeline also means a failed
      # migration fails the build visibly, instead of leaving a half-migrated
      # database behind a container that keeps restarting.
      #
      # Uses the direct (non-pooled) Neon URL — migrations need session-level
      # advisory locks, which the transaction-mode pooler does not support.
      # The secret is read from Secret Manager using the same Workload
      # Identity credentials as the deploy, so it is never stored in GitHub.
      - name: Run database migrations
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest \
            --secret=database-url-direct --project="$GCP_PROJECT")" \
            npx prisma migrate deploy

      # Deploy the exact SHA-tagged image just built, not :latest — so the
      # revision is pinned to this commit and a re-run can't pick up a
      # different build.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --max-instances 2 \
            --memory 512Mi \
            --cpu 1 \
            --quiet
